<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOAI | Tokio Asistente Virtual</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #f8f9fa;
            font-family: Inter, Arial, sans-serif;
        }

        flowise-fullchatbot {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

<flowise-fullchatbot></flowise-fullchatbot>

<script type="module">
import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"

Chatbot.initFull({
    chatflowid: "29c03fe8-841a-422c-9baf-6fdbff2f6b48",
    apiHost: "https://cloud.flowiseai.com",

    theme: {
        button: {
            backgroundColor: '#C1121F'
        },

        tooltip: {
            showTooltip: false
        },

        customCSS: `
            .chatbot-header {
                background: linear-gradient(
                    135deg,
                    #111111 0%,
                    #C1121F 100%
                ) !important;
            }

            .chatbot-container {
                border-radius: 0px !important;
                box-shadow: none !important;
            }
        `,

        chatWindow: {
            showTitle: true,
            title: 'Tokio · Asistente MOAI',

            titleAvatarSrc:
                'https://cdn-icons-png.flaticon.com/512/4712/4712027.png',

            welcomeMessage:
                'Hola 👋 Soy Tokio. ¿Cómo puedo ayudarte hoy?',

            backgroundColor: '#ffffff',

            starterPrompts: [
                'Quiero arrendar mi inmueble',
                'Estoy buscando una propiedad',
                'Necesito reportar una reparación',
                'Tengo dudas sobre mi contrato'
            ],

            renderHTML: true,

            botMessage: {
                backgroundColor: '#ffffff',
                textColor: '#111111',
                showAvatar: true,
                avatarSrc:
                    'https://cdn-icons-png.flaticon.com/512/4712/4712027.png'
            },

            userMessage: {
                backgroundColor: '#C1121F',
                textColor: '#ffffff'
            },

            textInput: {
                placeholder: 'Escribe tu mensaje...',
                sendButtonColor: '#C1121F'
            },

            footer: {
                textColor: '#666666',
                text: 'Atendido por',
                company: 'MOAI',
                companyLink: 'https://escalainmobiliaria.com.co'
            }
        }
    }
})
</script>

</body>
</html>
