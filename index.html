<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOAI Inmobiliaria</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(
                135deg,
                #111111 0%,
                #C1121F 100%
            );
            font-family:Inter,Arial,sans-serif;
            color:white;
            text-align:center;
        }

        .container{
            max-width:700px;
            padding:40px;
        }

        h1{
            font-size:56px;
            margin-bottom:20px;
        }

        p{
            font-size:20px;
            opacity:.9;
            margin-bottom:40px;
        }

        .btn{
            display:inline-block;
            padding:18px 40px;
            background:white;
            color:#C1121F;
            text-decoration:none;
            font-weight:bold;
            border-radius:12px;
            transition:.3s;
        }

        .btn:hover{
            transform:translateY(-3px);
        }

    </style>
</head>
<body>

<div class="container">

    <h1>🏠 MOAI</h1>

    <p>
        Administración inmobiliaria moderna,
        rápida y completamente digital.
    </p>

    <a class="btn" href="chatbot.html">
        Hablar con Tokio
    </a>

</div>

</body>
</html>
